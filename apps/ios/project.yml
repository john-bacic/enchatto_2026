name: Enchatto
options:
  bundleIdPrefix: com.enchatto
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"

packages:
  Mecab-Swift:
    url: https://github.com/shinjukunian/Mecab-Swift
    from: "0.8.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    GENERATE_INFOPLIST_FILE: YES

targets:
  Enchatto:
    type: application
    platform: iOS
    dependencies:
      - package: Mecab-Swift
        product: Mecab-Swift
      - package: Mecab-Swift
        product: IPADic
    postBuildScripts:
      - name: Inject Git Commit SHA
        # Runs on every build, and only once Xcode has written the Info.plist it stamps: Xcode orders
        # the phase after the task that produces its input file
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        script: |
          # Writes the commit the app is built from into the built Info.plist, where GitInfo.swift reads it.
          # Seven characters, the same slice deploy.sh takes
          SHA=$(git rev-parse --verify --quiet HEAD 2>/dev/null | cut -c1-7)
          if [ -z "$SHA" ]; then
            echo "warning: git names no commit for ${SRCROOT}, so the app shows its version as unknown"
            SHA=unknown
          fi
          plutil -replace GitCommitSHA -string "$SHA" "${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
    sources:
      - path: .
        excludes:
          - project.yml
          - README.md
          - "*.xcodeproj/**"
          - ".gitkeep"
          # Design sources for the app icon; the asset catalog holds what ships
          - "*.svg"
          # The command-line text tests (Package.swift, run with `swift test`). Not app source
          - ".gitignore"
          - ".build"
          - "Package.swift"
          - "Package.resolved"
          - "Tests"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.enchatto.app
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "Enchatto needs camera access to send photos"
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Enchatto needs photo library access to send images"
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Enchatto needs permission to save images to your photo library"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Enchatto uses the microphone for voice input and to record your pronunciation in games like Word Rush"
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Enchatto uses speech recognition to convert voice to text"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Enchatto.entitlements
