name: Enchatto
options:
  bundleIdPrefix: com.enchatto
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    GENERATE_INFOPLIST_FILE: YES

targets:
  Enchatto:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          - project.yml
          - README.md
          - "*.xcodeproj/**"
          - ".gitkeep"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.enchatto.app
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "Enchatto needs camera access to send photos"
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Enchatto needs photo library access to send images"
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Enchatto needs permission to save images to your photo library"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Enchatto needs microphone access for voice input"
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Enchatto uses speech recognition to convert voice to text"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
