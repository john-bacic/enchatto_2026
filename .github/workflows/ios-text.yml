name: iOS text tests

# The Japanese text code (casualizer, romaji, translation helpers) compiled as a Swift package and
# tested on macOS. This does not build the app: the Xcode project needs a generated file and signing.
on:
  push:
    branches: [main, redesign]
    paths:
      - "apps/ios/Package.swift"
      - "apps/ios/Package.resolved"
      - "apps/ios/Services/Processing/**"
      - "apps/ios/Tests/**"
      - ".github/workflows/ios-text.yml"
  pull_request:
    paths:
      - "apps/ios/Package.swift"
      - "apps/ios/Package.resolved"
      - "apps/ios/Services/Processing/**"
      - "apps/ios/Tests/**"
      - ".github/workflows/ios-text.yml"

concurrency:
  group: ios-text-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  text:
    name: Swift package tests
    runs-on: macos-26
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@v7
      - name: Swift version
        id: swift
        run: |
          swift --version
          echo "hash=$(swift --version 2>&1 | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"
      # A cold run fetches and compiles MeCab and its dictionary. The key names the toolchain, so a
      # runner image that moves to a newer Xcode starts clean instead of reusing another compiler's output
      - uses: actions/cache@v6
        with:
          path: apps/ios/.build
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.swift.outputs.hash }}-${{ hashFiles('apps/ios/Package.resolved') }}
      - run: swift test
